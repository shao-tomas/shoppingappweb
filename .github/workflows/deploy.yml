name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ghcr.io/shao-tomas/shoppingapp:latest .

      - name: Push image
        run: |
          docker push ghcr.io/shao-tomas/shoppingapp:latest

      - name: Trigger Azure deployment
        run: |
          curl --fail --request POST "${{ secrets.AZURE_WEBHOOK_URL }}"
